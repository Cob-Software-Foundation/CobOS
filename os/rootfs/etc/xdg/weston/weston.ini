# CobOS Wayland session: Weston on the DRM/KMS backend in kiosk mode.
# Kiosk mode needs Weston 10 or newer.

[core]
backend=drm
shell=kiosk
# Software rendering works on any GPU, including virtio-gpu in a VM.
# "renderer" is the Weston 12+ spelling and "use-pixman" the older one; unknown keys are ignored.
renderer=pixman
use-pixman=true

# The one full-screen program the session runs. Restart it if it exits.
[autolaunch]
path=/usr/bin/weston-terminal
watch=true
