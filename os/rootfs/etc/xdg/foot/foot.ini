# Settings for foot, the terminal that the CobOS session runs full screen (see rootfs/init).

[main]
font=DejaVu Sans Mono:size=11
shell=/bin/sh
# foot's own terminfo entry is not in the image; xterm-256color is (ncurses-terminfo-base).
term=xterm-256color
